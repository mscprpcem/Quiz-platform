name: Cleanup Old Workflow Runs and Storage

on:
  schedule:
    # Runs weekly every Sunday at 00:00 UTC to maintain clean storage
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual one-click trigger from the Actions tab

jobs:
  cleanup:
    name: Purge Runs Older Than 7 Days
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete workflow runs and artifacts older than 7 days
        uses: actions/github-script@v7
        with:
          script: |
            const daysToKeep = 7;
            const cutoffDate = new Date(Date.now() - daysToKeep * 24 * 60 * 60 * 1000);
            console.log(`Purging workflow runs completed before ${cutoffDate.toISOString()}...`);

            try {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                status: 'completed',
                per_page: 100
              });

              let deletedCount = 0;
              for (const run of runs) {
                const runDate = new Date(run.updated_at || run.created_at);
                if (runDate < cutoffDate) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: run.id
                    });
                    console.log(`✅ Deleted old run #${run.id} (${run.name}) from ${runDate.toISOString()}`);
                    deletedCount++;
                  } catch (err) {
                    console.warn(`Could not delete run #${run.id}: ${err.message}`);
                  }
                }
              }
              console.log(`Cleanup finished. Total deleted runs: ${deletedCount}`);
            } catch (err) {
              console.error('Error during cleanup:', err.message);
            }
